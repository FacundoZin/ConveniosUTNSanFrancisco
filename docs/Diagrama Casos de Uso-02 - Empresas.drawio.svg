<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="780px" height="430px" viewBox="0 0 780 430">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666"/>
    </marker>
  </defs>

  <!-- System boundary box -->
  <rect x="250" y="20" width="380" height="370" rx="0" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="440" y="48" text-anchor="middle" font-size="13" font-weight="bold" font-family="sans-serif" fill="#333">
    Sistema de gestión para secretaria de vinculación
  </text>
  <text x="440" y="68" text-anchor="middle" font-size="14" font-weight="bold" font-family="sans-serif" fill="#333">
    Tecnológica UTN San Francisco.
  </text>
  <text x="440" y="92" text-anchor="middle" font-size="14" font-weight="bold" font-family="sans-serif" fill="#333">
    Módulo: Empresas
  </text>

  <!-- Usuario Consultor (stick figure, left) -->
  <g transform="translate(115, 230)">
    <!-- Head -->
    <circle cx="0" cy="-40" r="10" fill="none" stroke="#333" stroke-width="2"/>
    <!-- Body -->
    <line x1="0" y1="-30" x2="0" y2="0" stroke="#333" stroke-width="2"/>
    <!-- Arms -->
    <line x1="-15" y1="-20" x2="15" y2="-20" stroke="#333" stroke-width="2"/>
    <!-- Legs -->
    <line x1="0" y1="0" x2="-12" y2="25" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="0" x2="12" y2="25" stroke="#333" stroke-width="2"/>
    <!-- Label -->
    <text x="0" y="42" text-anchor="middle" font-size="11" font-weight="bold" font-family="sans-serif" fill="#333">Usuario</text>
    <text x="0" y="56" text-anchor="middle" font-size="11" font-weight="bold" font-family="sans-serif" fill="#333">Consultor</text>
  </g>

  <!-- Usuario Gestor (stick figure, right) -->
  <g transform="translate(710, 235)">
    <circle cx="0" cy="-40" r="10" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="-30" x2="0" y2="0" stroke="#333" stroke-width="2"/>
    <line x1="-15" y1="-20" x2="15" y2="-20" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="0" x2="-12" y2="25" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="0" x2="12" y2="25" stroke="#333" stroke-width="2"/>
    <text x="0" y="42" text-anchor="middle" font-size="11" font-weight="bold" font-family="sans-serif" fill="#333">Usuario</text>
    <text x="0" y="56" text-anchor="middle" font-size="11" font-weight="bold" font-family="sans-serif" fill="#333">Gestor</text>
  </g>

  <!-- UC1: Visualizar empresas con convenios -->
  <ellipse cx="440" cy="135" rx="160" ry="28" fill="#fff" stroke="#82b366" stroke-width="2"/>
  <text x="440" y="139" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#333">Visualizar empresas con convenios</text>

  <!-- UC2: Listar convenios por empresa -->
  <ellipse cx="440" cy="215" rx="160" ry="28" fill="#fff" stroke="#82b366" stroke-width="2"/>
  <text x="440" y="219" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#333">Listar convenios por empresa</text>

  <!-- UC3: Registrar empresa -->
  <ellipse cx="440" cy="295" rx="160" ry="28" fill="#fff" stroke="#82b366" stroke-width="2"/>
  <text x="440" y="299" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#333">Registrar empresa</text>

  <!-- UC4: Editar empresa -->
  <ellipse cx="440" cy="365" rx="160" ry="28" fill="#fff" stroke="#82b366" stroke-width="2"/>
  <text x="440" y="369" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#333">Editar empresa</text>

  <!-- Edges: Consultor -> UC1, UC2 -->
  <line x1="125" y1="210" x2="280" y2="135" stroke="#666" stroke-width="1.5"/>
  <line x1="125" y1="220" x2="280" y2="215" stroke="#666" stroke-width="1.5"/>

  <!-- Edges: Gestor -> UC3, UC4 -->
  <line x1="700" y1="225" x2="600" y2="295" stroke="#666" stroke-width="1.5"/>
  <line x1="700" y1="230" x2="600" y2="365" stroke="#666" stroke-width="1.5"/>
</svg>
